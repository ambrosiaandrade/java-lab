# Configuração de logs para testes com slf4j-simple

# simplelogger.properties coloca no resources do teste

#<dependency>
#    <groupId>org.slf4j</groupId>
#    <artifactId>slf4j-simple</artifactId>
#    <version>2.0.17</version>
#    <scope>test</scope>
#</dependency>

# Nível global de log
org.slf4j.simpleLogger.defaultLogLevel=DEBUG

# Nível específico para a biblioteca
org.slf4j.simpleLogger.log.br.com.bradesco.core.lib.data.decryptor=DEBUG

# Formato de exibição
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
